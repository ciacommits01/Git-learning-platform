<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Git Garden — learn Git by playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f0ff;--card:#ffffff;--tx:#2b2250;--tx2:#6a6190;--line:#2b2250;--soft:#ebe6ff;
  --mint:#4fd1a8;--pink:#ff7aa8;--butter:#ffd25e;--sky:#69b7ff;--lav:#b9a4ff;--peach:#ff9f7a;--leaf:#7be08f;
  --on:#2b2250;--term:#1f1b3d;--termtx:#efeaff;
  --ok:#17a57a;--bad:#e0446f;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#161230;--card:#241e4d;--tx:#f1edff;--tx2:#aaa1d6;--line:#0b0820;--soft:#2f2862;--term:#0f0c26;--ok:#4fd1a8;--bad:#ff7aa8}
}
:root[data-theme="dark"]{--bg:#161230;--card:#241e4d;--tx:#f1edff;--tx2:#aaa1d6;--line:#0b0820;--soft:#2f2862;--term:#0f0c26;--ok:#4fd1a8;--bad:#ff7aa8}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:'Nunito',ui-rounded,system-ui,sans-serif;font-size:16px;line-height:1.5;
  background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--tx) 10%,transparent) 1.4px,transparent 0);background-size:26px 26px}
h1,h2,h3,h4{font-family:'Fredoka','Baloo 2',ui-rounded,'Arial Rounded MT Bold',sans-serif;margin:0;font-weight:600;letter-spacing:.1px}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

/* sticker primitives */
.card{background:var(--card);border:2.5px solid var(--line);border-radius:20px;box-shadow:4px 4px 0 var(--line);padding:16px}
.btn{background:var(--butter);color:var(--on);border:2.5px solid var(--line);border-radius:14px;padding:7px 14px;font-weight:800;box-shadow:3px 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.pink{background:var(--pink)}.btn.mint{background:var(--mint)}.btn.sky{background:var(--sky)}.btn.ghost{background:var(--card);color:var(--tx)}
.btn.sm{padding:4px 10px;font-size:.85rem;border-radius:11px;box-shadow:2px 2px 0 var(--line)}
.pill{display:inline-block;border:2px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:800;background:var(--soft);color:var(--tx)}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.5rem;cursor:pointer;background:none;border:0;padding:0}
.brand svg{width:44px;height:44px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav button{background:var(--card);border:2.5px solid var(--line);border-radius:14px;padding:6px 14px;font-weight:800;box-shadow:3px 3px 0 var(--line)}
.nav button[aria-current="page"]{background:var(--lav);color:var(--on)}
.xp{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:6px 12px;box-shadow:3px 3px 0 var(--line)}
.xp .lvl{font-family:'Fredoka',sans-serif;font-weight:600;white-space:nowrap}
.bar{width:120px;height:14px;border:2.5px solid var(--line);border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mint);transition:width .5s}
.xp small{color:var(--tx2);font-weight:700;white-space:nowrap}
main{padding:6px 18px 40px;max-width:1500px;margin:0 auto}

/* map */
.hello{display:flex;gap:18px;align-items:center;margin:8px 0 22px;flex-wrap:wrap}
.hello svg{width:110px;height:110px;flex:none}
.bubble{position:relative;background:var(--card);border:2.5px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:3px 3px 0 var(--line);max-width:640px}
.bubble::before{content:"";position:absolute;left:-12px;top:22px;width:18px;height:18px;background:var(--card);border-left:2.5px solid var(--line);border-bottom:2.5px solid var(--line);transform:rotate(45deg)}
.bubble p{margin:0}.bubble p+p{margin-top:6px}
.stickers{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.stk{width:40px;height:40px;border:2.5px dashed var(--tx2);border-radius:12px;display:grid;place-items:center;font-size:1.3rem;filter:grayscale(1);opacity:.45}
.stk.on{border:2.5px solid var(--line);background:var(--card);filter:none;opacity:1;box-shadow:2px 2px 0 var(--line)}
.world{margin-bottom:26px}
.world>header{display:flex;align-items:center;gap:12px;padding:10px 16px;border:2.5px solid var(--line);border-radius:18px 18px 0 0;box-shadow:4px 0 0 var(--line);color:var(--on)}
.world>header .em{font-size:2rem}
.world>header h2{font-size:1.35rem}.world>header p{margin:0;font-weight:700;font-size:.92rem;opacity:.85}
.world .prog{margin-left:auto;font-weight:800;white-space:nowrap}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:16px;background:var(--card);border:2.5px solid var(--line);border-top:0;border-radius:0 0 18px 18px;box-shadow:4px 4px 0 var(--line)}
.qn{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg);border:2.5px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:800;transition:transform .1s}
.qn:hover{transform:translateY(-2px)}
.qn .em{font-size:1.7rem}.qn .st{display:block;font-size:.8rem;color:var(--tx2);font-weight:700;letter-spacing:1px}
.qn.done{background:color-mix(in srgb,var(--mint) 25%,var(--card))}
.qn.boss{background:color-mix(in srgb,var(--pink) 22%,var(--card))}

/* lab */
.lab{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px}
.gitty-row{display:flex;gap:10px;align-items:flex-start}
.gitty-row svg{width:92px;height:92px;flex:none}
.gitty-row .bubble{font-size:.95rem;padding:10px 12px}
.qcard h3{font-size:1.25rem;margin-bottom:4px}
.goals{list-style:none;padding:0;margin:10px 0}
.goals li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-weight:700}
.goals .ck{flex:none;width:22px;height:22px;border:2.5px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:.8rem;background:var(--card)}
.goals li.ok .ck{background:var(--mint)}
.goals li.ok span:last-child{text-decoration:line-through;opacity:.65}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hint{margin-top:10px;padding:8px 10px;background:color-mix(in srgb,var(--butter) 30%,var(--card));border:2px dashed var(--line);border-radius:12px;font-weight:700;font-size:.92rem}
.hint code{background:var(--card);border:1.5px solid var(--line);padding:0 5px;border-radius:6px;font-size:.84rem}
.stage{display:flex;flex-direction:column;gap:16px;min-width:0}
.viz{padding:12px}
.zones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.zone{position:relative;background:var(--bg);border:2.5px solid var(--line);border-radius:16px;padding:8px 10px;min-height:128px}
.zone h4{font-size:1rem;display:flex;gap:6px;align-items:center}
.zone .sub{font-size:.74rem;color:var(--tx2);font-weight:700;line-height:1.25;margin-bottom:6px}
.zone .arrow{position:absolute;right:-17px;top:50%;transform:translateY(-50%);z-index:2;font-size:.66rem;font-weight:800;background:var(--butter);color:var(--on);border:2px solid var(--line);border-radius:99px;padding:0 6px;white-space:nowrap}
.zone:last-child .arrow{display:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:'JetBrains Mono',monospace;font-size:.74rem;font-weight:600;border:2px solid var(--line);border-radius:10px;padding:1px 7px;background:var(--card);color:var(--tx);display:inline-flex;gap:5px;align-items:center}
.chip em{font-style:normal;font-family:'Nunito',sans-serif;font-size:.66rem;font-weight:800;background:var(--line);color:var(--card);border-radius:6px;padding:0 4px}
.chip.s-new{background:color-mix(in srgb,var(--pink) 45%,var(--card))}
.chip.s-mod{background:color-mix(in srgb,var(--butter) 55%,var(--card))}
.chip.s-del{background:color-mix(in srgb,var(--bad) 20%,var(--card));text-decoration:line-through}
.chip.s-stg{background:color-mix(in srgb,var(--mint) 50%,var(--card))}
.chip.s-con{background:color-mix(in srgb,var(--peach) 60%,var(--card))}
.chip.s-ign{border-style:dashed;opacity:.55}
.chip.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.empty{font-size:.8rem;color:var(--tx2);font-weight:700}
.zone .meta{font-size:.72rem;font-weight:800;color:var(--tx2);margin-bottom:4px;word-break:break-word}
.graphwrap{margin-top:10px;border:2.5px solid var(--line);border-radius:16px;background:var(--bg);overflow:auto;max-height:430px}
.graphwrap svg{display:block}
.graphwrap .empty{padding:18px}
.gcap{display:flex;gap:8px;align-items:center;font-weight:800;margin:10px 2px 0}
.gcap small{color:var(--tx2);font-weight:700}
.work{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:stretch}
.term{background:var(--term);color:var(--termtx);padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:360px}
.tbar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:color-mix(in srgb,var(--termtx) 10%,var(--term));border-bottom:2.5px solid var(--line)}
.tbar i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.tbar span{margin-left:8px;font-weight:800;font-size:.85rem;opacity:.8}
.tout{flex:1;overflow:auto;padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:.82rem;line-height:1.45;max-height:340px;min-height:200px;white-space:pre-wrap;word-break:break-word}
.ln{min-height:1.45em}
.c-g{color:#6ff0c2}.c-r{color:#ff8fae}.c-y{color:#ffd96b}.c-b{color:#86c3ff}.c-c{color:#7de8ff}.c-m{color:#d3b8ff}.c-dim{opacity:.55}.c-bold{font-weight:700}
.prompt-pink{color:#ff9cc0}.prompt-mint{color:#6ff0c2}
.inrow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:2.5px solid var(--line);background:color-mix(in srgb,var(--termtx) 6%,var(--term))}
.inrow .ps{font-family:'JetBrains Mono',monospace;font-size:.82rem;white-space:nowrap}
.inrow input{flex:1;min-width:0;background:transparent;border:0;color:var(--termtx);font-family:'JetBrains Mono',monospace;font-size:.9rem;outline:none;caret-color:var(--pink)}
.inrow button{flex:none}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:2px dashed color-mix(in srgb,var(--termtx) 25%,transparent)}
.chiprow button{background:transparent;color:var(--termtx);border:1.5px solid color-mix(in srgb,var(--termtx) 45%,transparent);border-radius:99px;padding:1px 10px;font-family:'JetBrains Mono',monospace;font-size:.74rem}
.chiprow button:hover{background:color-mix(in srgb,var(--termtx) 18%,transparent)}
.explain{display:flex;flex-direction:column;gap:12px}
.explain h4{font-size:1rem;margin-bottom:5px}
.toks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tok{border:2px solid var(--line);border-radius:12px;padding:3px 8px;background:var(--soft);max-width:100%}
.tok b{display:block;font-family:'JetBrains Mono',monospace;font-size:.8rem;word-break:break-all}
.tok span{display:block;font-size:.72rem;font-weight:700;color:var(--tx2);line-height:1.25}
.tok.t-git{background:color-mix(in srgb,var(--lav) 45%,var(--card))}
.tok.t-cmd{background:color-mix(in srgb,var(--pink) 45%,var(--card))}
.tok.t-flag{background:color-mix(in srgb,var(--butter) 55%,var(--card))}
.tok.t-arg{background:color-mix(in srgb,var(--sky) 40%,var(--card))}
.tok.t-bad{background:color-mix(in srgb,var(--bad) 22%,var(--card))}
.sum{margin:0;font-weight:700}
.warn{margin:8px 0 0;padding:7px 10px;border:2px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--butter) 40%,var(--card));font-weight:800;font-size:.9rem}
.last{border-top:2.5px dashed var(--line);padding-top:10px}
.last p{margin:0 0 6px;font-weight:600}
.last .hood{font-size:.86rem;color:var(--tx2);font-weight:600;background:var(--soft);border-radius:10px;padding:6px 10px}
.last.bad h4{color:var(--bad)}

/* reference + quiz + modal */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 16px;align-items:center}
.tools input[type=search]{flex:1;min-width:180px;padding:8px 14px;border:2.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;font-weight:700}
.tabs{display:flex;gap:8px;margin:8px 0 14px}
.tabs button.on{background:var(--lav)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.cmd h3{display:flex;gap:8px;align-items:center;font-size:1.1rem;margin-bottom:6px}
.cmd p{margin:0 0 8px;font-weight:600}
.cmd pre{margin:0 0 8px;background:var(--term);color:var(--termtx);padding:8px 10px;border-radius:12px;border:2px solid var(--line);overflow:auto;font-size:.8rem}
.cmd ul{margin:0 0 10px;padding-left:18px;font-size:.84rem;color:var(--tx2);font-weight:700}
.cmd li code{color:var(--tx);background:var(--soft);padding:0 4px;border-radius:5px}
.concept .big{font-size:2rem}.concept .an{font-weight:800;background:var(--soft);border-radius:12px;padding:6px 10px;margin-top:8px;font-size:.9rem}
.quiz{max-width:760px;margin:0 auto}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--card);border:2.5px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;box-shadow:3px 3px 0 var(--line)}
.opt:hover:not([disabled]){background:var(--soft)}
.opt.right{background:var(--mint);color:var(--on)}.opt.wrong{background:var(--pink);color:var(--on)}
#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(20,14,50,.55);z-index:50;padding:18px}
#modal.on{display:grid}
#modal .card{max-width:480px;width:100%;text-align:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
#modal svg{width:120px;height:120px}
.stars{font-size:2rem;letter-spacing:4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:10px;height:14px;border:2px solid var(--line);border-radius:3px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;background:var(--pink);color:var(--on);border:2.5px solid var(--line);border-radius:16px;padding:8px 18px;font-weight:800;box-shadow:4px 4px 0 var(--line);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){.bob,.chip.pop,#confetti i,#modal .card,.toast{animation:none}.bar i{transition:none}}

@media (max-width:1180px){.lab{grid-template-columns:300px minmax(0,1fr)}.work{grid-template-columns:1fr}}
@media (max-width:860px){
  .lab{grid-template-columns:1fr}.stage{order:2}.side{order:1}.work{order:-1}
  .zones{grid-template-columns:repeat(2,minmax(0,1fr))}.zone .arrow{display:none}
  .xp{margin-left:0;width:100%}.bar{flex:1}
  main{padding:6px 12px 40px}
  .tout{max-height:280px}
}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="brand" aria-label="Go to quest map"><span id="logo"></span><span>Git Garden</span></button>
  <nav class="nav" id="nav">
    <button data-view="map">Quest map</button>
    <button data-view="sandbox">Sandbox</button>
    <button data-view="book">Command book</button>
  </nav>
  <div class="xp" title="Earn XP by completing quests and boss quizzes">
    <span class="lvl" id="lvl">Level 1</span>
    <div class="bar" role="progressbar" aria-label="XP to next level"><i id="xpfill"></i></div>
    <small id="xptxt">0 XP</small>
  </div>
</header>
<main>
  <section id="v-map"></section>
  <section id="v-lab" hidden>
    <div class="lab">
      <aside class="side">
        <div class="gitty-row"><div id="gitty" class="bob"></div><div class="bubble" id="bubble"></div></div>
        <div class="card qcard" id="qcard"></div>
      </aside>
      <div class="stage">
        <div class="card viz">
          <div class="zones" id="zones"></div>
          <div class="gcap"><b>History</b><small id="gcap"></small></div>
          <div class="graphwrap" id="graph"></div>
        </div>
        <div class="work">
          <div class="card term">
            <div class="tbar"><i style="background:#ff7aa8"></i><i style="background:#ffd25e"></i><i style="background:#4fd1a8"></i><span>garden terminal</span></div>
            <div class="tout" id="tout" aria-live="polite"></div>
            <div class="chiprow" id="chips"></div>
            <div class="inrow"><span class="ps" id="ps"></span><input id="cmd" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Type a git command" placeholder="type a command…"><button class="btn pink sm" id="run">Run</button></div>
          </div>
          <div class="card explain" id="explain">
            <div>
              <h4>✨ Live explainer</h4>
              <div class="toks" id="toks"></div>
              <p class="sum" id="sum"></p>
              <p class="warn" id="warn" hidden></p>
            </div>
            <div class="last" id="last"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section id="v-book" hidden></section>
  <section id="v-quiz" hidden></section>
</main>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="confetti"></div>
<script>
/* ================= GIT ENGINE: a tiny pretend-git that lives in memory ================= */
const DAY0=Date.UTC(2026,9,14,9,0,0);
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const p2=n=>String(n).padStart(2,'0');
const fmtDate=seq=>{const d=new Date(DAY0+seq*47*60000);return `${WD[d.getUTCDay()]} ${MO[d.getUTCMonth()]} ${d.getUTCDate()} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:00 2026 +0000`;};
const isoDate=seq=>{const d=new Date(DAY0+seq*47*60000);return `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())}`;};
function sha(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
 return ((h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0')).slice(0,7);}
const full=id=>(id+sha(id+'a')+sha(id+'b')+sha(id+'c')+sha(id+'d')+sha(id+'e')).slice(0,40);
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const uniq=a=>[...new Set(a)];
const lines=s=>(s===undefined||s==='')?[]:s.split('\n');
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const emailOf=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^\.|\.$/g,'')+'@garden.dev';

function newRepo(){return{inited:false,seq:0,commits:{},branches:{},head:{branch:'main'},index:{},work:{},stash:[],tags:{},tagMsg:{},remote:null,tracking:{},upstream:{},reflog:[],config:{},op:null,bisect:null,prevBranch:null,tm:0,flags:{},orig:null};}
function resetRepo(r){for(const k of Object.keys(r))delete r[k];Object.assign(r,newRepo());}

const CONCEPTS=[
 {e:'🗂️',t:'Repository',x:'A project folder plus Git\'s memory (the hidden .git folder). It holds every snapshot you have ever saved.',a:'Think of a photo album that remembers every version of your garden.'},
 {e:'📸',t:'Commit',x:'A saved snapshot of your whole project, with a message, an author, a date and a pointer to its parent commit.',a:'A polaroid with a sticky note on the back saying why you took it.'},
 {e:'🧺',t:'Staging area (index)',x:'A waiting room between your files and the next commit. You choose exactly which changes go into the snapshot.',a:'A basket: you pick the flowers first, then take the photo.'},
 {e:'🪴',t:'Working directory',x:'The real files you see and edit. Git compares them with the staging area and the last commit.',a:'Your desk, where the actual mess happens.'},
 {e:'🌿',t:'Branch',x:'A movable label pointing at a commit. Making one is instant and free, so use them for every idea.',a:'A sticky note you can move. The garden itself is untouched.'},
 {e:'🧭',t:'HEAD',x:'A pointer to where you are now — normally the branch you are on, which in turn points at a commit.',a:'The "you are here" pin on the map.'},
 {e:'🤝',t:'Merge',x:'Combines two branches. If one is simply ahead, Git fast-forwards; otherwise it makes a merge commit with two parents.',a:'Two paths in the forest joining into one.'},
 {e:'⚔️',t:'Merge conflict',x:'Both branches changed the same lines. Git marks both versions in the file and asks you to choose.',a:'Two friends repainted the same fence panel — you pick the colour.'},
 {e:'🛤️',t:'Rebase',x:'Replays your commits on top of a different base, creating new commits with new IDs. Gives a straight history, but rewrites it.',a:'Lifting your sticker sheet and re-sticking it further along the page.'},
 {e:'⏩',t:'Fast-forward',x:'When the branch you merge is directly ahead, Git just moves the label forward. No new commit is needed.',a:'Sliding a bookmark ahead a few pages.'},
 {e:'☁️',t:'Remote & origin',x:'Another copy of the repo, usually on GitHub. "origin" is the default nickname for where you cloned from.',a:'The shared cloud album your team can all see.'},
 {e:'🔗',t:'Upstream / tracking',x:'The link between a local branch (main) and its remote twin (origin/main). It lets plain git push and git pull know where to go.',a:'A string tied between two balloons.'},
 {e:'🎒',t:'Stash',x:'A shelf for uncommitted work, so you can switch tasks with a clean folder and come back later.',a:'Swiping your half-finished puzzle into a drawer.'},
 {e:'👻',t:'Detached HEAD',x:'HEAD points directly at a commit instead of a branch. Great for looking around; make a branch if you want to keep new work.',a:'Visiting the past as a ghost: you can look, but nothing sticks unless you plant a flag.'},
 {e:'🏷️',t:'Tag',x:'A permanent name on one commit, usually for releases. Unlike branches, tags never move.',a:'A flag planted at a milestone.'},
 {e:'🛟',t:'Reflog',x:'Git\'s private diary of where HEAD has been. Commits you "lost" are usually still findable here for weeks.',a:'Security-camera footage of your own mistakes.'},
 {e:'🙈',t:'.gitignore',x:'A file listing patterns Git should pretend not to see — logs, build folders, secrets, node_modules.',a:'A "do not photograph" list.'},
 {e:'🧬',t:'Objects & hashes',x:'Git stores blobs (file contents), trees (folders) and commits, each named by a hash of its content. Same content = same ID.',a:'Every sticker has a fingerprint that is impossible to fake.'}
];

function printLines(lines){const o=$('#tout');for(const line of lines){const d=document.createElement('div');d.className='ln';for(const[t,c]of line){const s=document.createElement('span');if(c)s.className='c-'+c;s.textContent=t;d.appendChild(s);}o.appendChild(d);}o.scrollTop=o.scrollHeight;}
function promptParts(){const r=S.repo;let b='';if(r.inited){const dirty=r.inited&&(dirtyFiles(r).size||changes(r).untracked.length);b=` (${curName(r)||'detached'}${dirty?'*':''})`;}return['~/garden',b];}
function renderPrompt(){const[a,b]=promptParts();$('#ps').innerHTML=`<span class="prompt-mint">${esc(a)}</span><span class="prompt-pink">${esc(b)}</span> $`;}
function exec(line){line=line.trim();if(!line)return;const[a,b]=promptParts();
 printLines([[[a,'g'],[b,'m'],[' $ ',''],[line,'bold']]]);
 S.hist.push(line);S.hi=S.hist.length;const X=runLine(S.repo,line);
 if(X.clear)$('#tout').innerHTML='';else printLines(X.o);S.h.push(line);
 showLast(X);renderAll();
 if(!X.ok&&line!==''){const w=X.why||'Read the red text — it usually tells you what to do.';say(`Oops! ${esc(w.length>150?w.slice(0,147).replace(/\s\S*$/,'')+'…':w)} 🌸`,'oops');}
 else if(S.mode==='sandbox'&&X.why)say(esc(X.why.split(/(?<=[.!?])\s/)[0]),'happy');
 if(S.mode==='quest')checkGoals();}
function showLast(X){const el=$('#last');el.className='last'+(X.ok?'':' bad');
 el.innerHTML=`<h4>${X.ok?'🎬 What just happened':'🙅 Git said no'}</h4><p>${esc(X.why||'Done.')}</p>${X.hood?`<div class="hood">🔧 Under the hood: ${esc(X.hood)}</div>`:''}`;}
function chipsFor(){return['git status','git add .','git commit -m ""','git log --oneline','git branch','git diff','ls','touch ','edit ','teammate','help'];}
function renderChips(){$('#chips').innerHTML=chipsFor().map(c=>`<button data-ins="${esc(c)}">${esc(c.trim())}</button>`).join('');}
function insert(t){const i=$('#cmd');i.value=t;i.focus();const q=t.indexOf('""');if(q>=0)i.setSelectionRange(q+1,q+1);liveExplain(i.value);}
function complete(){const i=$('#cmd'),v=i.value,r=S.repo,word=(v.match(/(\S*)$/)||['',''])[1],before=v.slice(0,v.length-word.length),t=tokenize(before);let pool;
 if(!t.length)pool=['git',...Object.keys(SH)];else if(t[0]==='git'&&t.length===1)pool=uniq([...Object.keys(GIT).filter(k=>!k.startsWith('-')&&k!=='version'),...REF.map(x=>x.n)]);
 else pool=uniq([...Object.keys(r.branches),...Object.keys(r.tracking),...Object.keys(r.work),...Object.keys(r.tags),...(r.remote?[r.remote.name]:[]),'HEAD']);
 const hits=pool.filter(p=>p.startsWith(word)&&p!==word).sort();if(!hits.length)return;
 if(hits.length===1){i.value=before+hits[0]+' ';}else{let c=hits[0];for(const h of hits)while(!h.startsWith(c))c=c.slice(0,-1);if(c.length>word.length)i.value=before+c;else printLines([[[hits.join('   '),'dim']]]);}
 liveExplain(i.value);}

 if(i===0){if(w==='git')return['t-git','Every Git command starts with this'];if(SHD[w])return['t-cmd',SHD[w]];const m=['git',...Object.keys(SHD)].filter(x=>x.startsWith(w));return m.length&&w.length<7?['t-arg','keep typing… '+m.slice(0,3).join(', ')]:['t-bad','not a command I know'];}
 if(t[0]!=='git'){if(!q&&(w==='>'||w==='>>'))return['t-flag',w==='>>'?'append to the file':'overwrite the file'];return['t-arg',q?'text':'a file name or value'];}
 if(i===1){const e=REFMAP[w];if(e)return['t-cmd',e.d.split(/(?<=\.)\s/)[0]];const m=Object.keys(REFMAP).filter(x=>x.startsWith(w));return m.length?['t-arg','keep typing… '+m.slice(0,4).join(', ')]:['t-bad','not a git command'];}
 if(!q&&w.startsWith('-')&&w!=='-'){const e=REFMAP[sub];const hit=e&&e.f.find(([k])=>k.split(' ')[0]===w.split('=')[0]);return['t-flag',hit?hit[1]:(GFL[w.split('=')[0]]||'an option that tweaks the command')];}
 if(prev==='-m'||prev==='--message')return['t-arg','the message text'];
 if(['-b','-c','-C','-B'].includes(prev))return['t-arg','name for the new branch'];
 if(w==='.')return['t-arg','everything in this folder'];
 if(r.branches[w])return['t-arg','a branch'];if(r.tracking[w])return['t-arg','a remote branch'];if(r.tags[w])return['t-arg','a tag'];
 if(r.remote&&w===r.remote.name)return['t-arg','the remote'];
 if(r.work[w]!==undefined||r.index[w]!==undefined)return['t-arg','a file'];
 if(r.inited&&resolveRev(r,w))return['t-arg','a commit'];
 if(/^HEAD/.test(w))return['t-arg','where you are now (HEAD~1 = one commit back)'];
 return['t-arg',q?'text':'a name or value'];}
const nmq=a=>a.map(x=>'“'+x+'”').join(', ');

let liveTimer=null;
function liveExplain(v){const t=tokenize(v),r=S.repo,toks=$('#toks'),sum=$('#sum'),warn=$('#warn');
 if(!t.length){toks.innerHTML='';sum.textContent='Start typing and I\'ll explain each word live. Try  git status  or  git help.';warn.hidden=true;return;}
 const sub=t[0]==='git'?t[1]:null;
 toks.innerHTML=t.map((w,i)=>{const[k,d]=describeTok(t,i,sub);return `<div class="tok ${k}"><b>${esc(t.q[i]?'"'+w+'"':w)}</b><span>${esc(d)}</span></div>`;}).join('');
 let s='',wn='';
 if(t[0]==='git'){if(!sub){s='Now type what you want Git to do: status, add, commit, branch, merge…';}
  else if(GIT[sub]||REFMAP[sub]){const e=REFMAP[sub];const{pos,f}=parseArgs(t.slice(2),['-m','--message','-c','-b','-C','-B','--author','-n']);
   try{const x=LIVE[sub]?LIVE[sub]({pos,f},r,f):[e?e.d:'',''];s=x[0];wn=x[1];}catch(err){s=e?e.d:'';}
   if(!r.inited&&!['init','clone','config','help'].includes(sub))wn='⚠️ This folder is not a repository yet — run git init first.';}
  else s='That is not a git command I know. Type git help for the list.';}
 else if(SHD[t[0]])s=SHD[t[0]][0].toUpperCase()+SHD[t[0]].slice(1)+'.';
 sum.textContent=s;warn.textContent=wn;warn.hidden=!wn;}

function renderZones(){const r=S.repo,ch=changes(r),conf=new Set(ch.conflicts),keys=new Set();
 const chip=(z,n,st,lab)=>{const k=z+'|'+n+'|'+st;keys.add(k);return `<span class="chip ${st?'s-'+st:''}${prevKeys.has(k)?'':' pop'}">${esc(n)}${lab?`<em>${lab}</em>`:''}</span>`;};
 const names=uniq([...Object.keys(r.work),...Object.keys(r.index)]).sort();
 const wk=names.map(f=>conf.has(f)?chip('w',f,'con','conflict'):r.work[f]===undefined?chip('w',f,'del','deleted'):r.index[f]===undefined?(isIgnored(r,f)?chip('w',f,'ign','ignored'):chip('w',f,'new','new')):r.work[f]!==r.index[f]?chip('w',f,'mod','edited'):chip('w',f,'','')).join('');
 const sg=ch.staged.map(s=>chip('s',s.k==='R'?`${s.from}→${s.f}`:s.f,s.k==='D'?'del':'stg',{A:'new',M:'edited',D:'deleted',R:'renamed'}[s.k])).join('');
 const ht=headTree(r),hid=headId(r);const rp=Object.keys(ht).sort().map(f=>chip('r',f,'','')).join('');
 let rm='',rmeta='';
 if(r.remote){const bs=r.remote.branches;const bn=(curName(r)&&bs[curName(r)])?curName(r):(bs.main?'main':Object.keys(bs)[0]);if(bn){rm=Object.keys(treeOf(r,bs[bn])).sort().map(f=>chip('c',f,'','')).join('');rmeta=`${r.remote.name}/${bn} @ ${bs[bn]}`;}else rmeta=r.remote.name+' (empty)';}
 prevKeys=keys;
 const Z=(e,t,sub,meta,body,emp,arrow)=>`<div class="zone"><h4><span>${e}</span>${t}</h4><div class="sub">${sub}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}<div class="chips">${body||`<span class="empty">${emp}</span>`}</div>${arrow?`<span class="arrow">${arrow} ›</span>`:''}</div>`;
 $('#zones').innerHTML=Z('🪴','Working folder','where you edit files',r.inited?'':'', wk,'no files yet — try touch hello.txt','add')+
  Z('🧺','Staging area','the basket for your next snapshot','',sg,r.inited?'empty basket':'needs git init','commit')+
  Z('📸','Local repo','your saved snapshots',hid?`${curName(r)||'detached'} @ ${hid}`:'',rp,r.inited?'no snapshots yet':'not a repo — git init','push')+
  Z('☁️','Remote','the shared copy online',rmeta,rm,r.remote?'nothing pushed yet':'no remote — git remote add','');}

function renderGraph(){const r=S.repo,el=$('#graph');const all=Object.values(r.commits).sort((a,b)=>a.seq-b.seq);

 const walk=tip=>{const ch=[];let id=tip;while(id&&lane[id]===undefined&&r.commits[id]){ch.push(id);id=r.commits[id].parents[0];}if(ch.length){ch.forEach(c=>{lane[c]=nl;});nl++;}};
 order.forEach(([,t])=>walk(t));[...reach].sort((a,b)=>r.commits[b].seq-r.commits[a].seq).forEach(id=>{if(lane[id]===undefined)walk(id);});
 const ghosts=all.filter(c=>!reach.has(c.id));const gl=nl;const lanes=nl+(ghosts.length?1:0);ghosts.forEach(c=>{lane[c.id]=gl;});
 const XS=100,LH=96,PL=64,PT=84;const pos={};all.forEach((c,i)=>{pos[c.id]={x:PL+i*XS,y:PT+lane[c.id]*LH};});
 const W=PL*2+(all.length-1)*XS+30,H=PT+(lanes-1)*LH+70;const col=l=>l>=gl&&ghosts.length&&l===gl?'#a79fc9':LANE_COL[l%LANE_COL.length];const ink='#2b2250';
 let edges='',nodes='';
 all.forEach(c=>{c.parents.forEach((p,k)=>{if(!pos[p])return;const a=pos[p],b=pos[c.id],mx=(a.x+b.x)/2,g=!reach.has(c.id);const l=k===0?lane[c.id]:lane[p];
  edges+=`<path d="M${a.x} ${a.y} C${mx} ${a.y} ${mx} ${b.y} ${b.x} ${b.y}" fill="none" stroke="${col(l)}" stroke-width="5" stroke-linecap="round" ${g?'stroke-dasharray="3 9" opacity=".6"':''}/>`;});});
 const refs={};const addRef=(id,o)=>{if(id)(refs[id]=refs[id]||[]).push(o);};
 Object.entries(r.branches).forEach(([b,id])=>addRef(id,{t:(!isDet(r)&&r.head.branch===b)?'HEAD ➜ '+b:b,k:'b'}));
 if(isDet(r))addRef(hid,{t:'HEAD',k:'h'});Object.entries(r.tags).forEach(([t,id])=>addRef(id,{t:'🏷 '+t,k:'t'}));Object.entries(r.tracking).forEach(([t,id])=>addRef(id,{t:'☁ '+t,k:'r'}));
 all.forEach(c=>{const{x,y}=pos[c.id],g=!reach.has(c.id),l=lane[c.id],mg=c.parents.length>1,fill=col(l);
  const eyes=g?`<path d="M-7 -4 L-3 0 M-3 -4 L-7 0 M3 -4 L7 0 M7 -4 L3 0" stroke="${ink}" stroke-width="1.8" stroke-linecap="round"/>`:`<circle cx="-5" cy="-2" r="2.3" fill="${ink}"/><circle cx="5" cy="-2" r="2.3" fill="${ink}"/>`;
  const mouth=g?`<path d="M-4 6 L4 6" stroke="${ink}" stroke-width="2" stroke-linecap="round"/>`:mg?`<circle cx="0" cy="6" r="2.4" fill="${ink}"/>`:`<path d="M-4 4 Q0 9 4 4" fill="none" stroke="${ink}" stroke-width="2" stroke-linecap="round"/>`;
  const isH=c.id===hid;
  let pills='';(refs[c.id]||[]).forEach((o,i)=>{const w=o.t.length*6.5+16,py=-38-i*21;const f=o.k==='b'?fill:o.k==='h'?'#ff7aa8':o.k==='t'?'#ffd25e':'none';
   pills+=`<g transform="translate(0 ${py})"><rect x="${-w/2}" y="-9" width="${w}" height="18" rx="9" fill="${f}" ${o.k==='r'?`stroke="currentColor" stroke-dasharray="3 2"`:`stroke="${ink}"`} stroke-width="2"/><text y="4" text-anchor="middle" font-size="11" font-weight="800" font-family="Nunito,sans-serif" fill="${o.k==='r'?'currentColor':ink}">${esc(o.t)}</text></g>`;});
  nodes+=`<g transform="translate(${x} ${y})" ${g?'opacity=".55"':''}><title>${esc(c.id+' — '+c.msg+'\n'+c.author)}</title>${isH?`<circle r="23" fill="none" stroke="#ff7aa8" stroke-width="3" stroke-dasharray="4 4"/>`:''}<circle r="17" fill="${fill}" stroke="${ink}" stroke-width="3" ${g?'stroke-dasharray="4 3"':''}/>${eyes}${mouth}${pills}
   <text y="35" text-anchor="middle" font-size="10" font-family="JetBrains Mono,monospace" fill="currentColor" opacity=".7">${c.id}</text><text y="48" text-anchor="middle" font-size="11" font-weight="700" font-family="Nunito,sans-serif" fill="currentColor">${esc(c.msg.length>15?c.msg.slice(0,14)+'…':c.msg)}</text></g>`;});
 el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="color:var(--tx)" role="img" aria-label="Commit history graph">${edges}${nodes}</svg>`;el.scrollLeft=el.scrollWidth;
 $('#gcap').textContent=`${plural(Object.keys(r.branches).length,'branch')} · ${plural(reach.size,'commit')}${ghosts.length?` · ${ghosts.length} orphaned (faded & dashed — still in the reflog)`:''}`;}
function renderAll(){renderZones();renderGraph();renderPrompt();liveExplain($('#cmd').value);}

/* ---------- command book ---------- */
function renderBook(){const cats=['All',...uniq(REF.map(x=>x.c))];
 let h=`<div class="tabs"><button class="btn ${S.bookTab==='cmds'?'on':'ghost'}" data-tab="cmds">Commands (${REF.length})</button><button class="btn ${S.bookTab==='concepts'?'on':'ghost'}" data-tab="concepts">Concepts (${CONCEPTS.length})</button></div>`;
 if(S.bookTab==='cmds'){const q=S.bookQ.toLowerCase();const list=REF.filter(x=>(S.bookCat==='All'||x.c===S.bookCat)&&(!q||(x.n+' '+x.d).toLowerCase().includes(q)));
  h+=`<div class="tools"><input type="search" id="bq" placeholder="Search commands…" value="${esc(S.bookQ)}" aria-label="Search commands">${cats.map(c=>`<button class="btn sm ${S.bookCat===c?'pink':'ghost'}" data-cat="${c}">${c}</button>`).join('')}</div><div class="cgrid">`;
  list.forEach(x=>{h+=`<div class="card cmd"><h3><span>${x.e}</span><code>git ${x.n}</code><span class="pill">${x.c}</span></h3><p>${esc(x.d)}</p><pre>${esc(x.ex)}</pre>${x.f.length?`<ul>${x.f.map(([k,v])=>`<li><code>${esc(k)}</code> — ${esc(v)}</li>`).join('')}</ul>`:''}${x.sim===false?`<span class="pill">read-only: concept in the garden</span>`:`<button class="btn sm mint" data-try="${esc(x.ex)}">Try it in the sandbox</button>`}</div>`;});
  if(!list.length)h+='<p class="empty">No commands match.</p>';h+='</div>';}
 else{h+='<div class="cgrid">'+CONCEPTS.map(c=>`<div class="card concept"><div class="big">${c.e}</div><h3>${esc(c.t)}</h3><p style="font-weight:600;margin:4px 0">${esc(c.x)}</p><div class="an">💭 ${esc(c.a)}</div></div>`).join('')+'</div>';}
 $('#v-book').innerHTML=h;}

/* ---------- boss quiz ---------- */
function startQuiz(wid){S.quiz={w:wid,i:0,score:0,answered:false};renderQuiz();setView('quiz');}
function renderQuiz(){const z=S.quiz,w=WORLDS.find(x=>x.id===z.w),qs=QUIZ[z.w];
 if(z.i>=qs.length){const prev=P.quiz[z.w]||0;const gain=Math.max(0,z.score-prev)*20;if(P.quiz[z.w]===undefined||z.score>prev){P.quiz[z.w]=z.score;saveProg();}if(gain)addXP(gain);if(z.score===qs.length)confetti();
  $('#v-quiz').innerHTML=`<div class="card quiz" style="text-align:center"><div class="bob" style="display:inline-block;width:120px">${gitty(z.score>=2?'cheer':'think')}</div><h2>${w.e} ${w.n} boss quiz: ${z.score}/${qs.length}</h2><p style="font-weight:800">${z.score===qs.length?'Flawless! 👑':z.score>=2?'Nice work!':'Good try — replay the quests and come back!'} ${gain?`+${gain} XP`:''}</p><div class="row" style="justify-content:center"><button class="btn mint" data-qz="again">Try again</button><button class="btn ghost" data-go="map">Back to the map</button></div></div>`;return;}
 const q=qs[z.i];$('#v-quiz').innerHTML=`<div class="card quiz"><span class="pill" style="background:${w.col};color:#2b2250">👑 ${w.n} boss · question ${z.i+1}/${qs.length}</span><h3 style="margin:10px 0 4px;font-size:1.3rem">${esc(q.q)}</h3>${q.o.map((o,i)=>`<button class="opt" data-opt="${i}">${esc(o)}</button>`).join('')}<div id="qfb"></div></div>`;}
function answerQuiz(i){const z=S.quiz;if(z.answered)return;z.answered=true;const q=QUIZ[z.w][z.i];const ok=i===q.a;if(ok)z.score++;
 document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('right');else if(k===i)b.classList.add('wrong');});
 $('#qfb').innerHTML=`<p style="font-weight:800;margin:10px 0">${ok?'✅ Correct!':'❌ Not quite.'} ${esc(q.x)}</p><button class="btn mint" data-qz="next">${z.i+1>=QUIZ[z.w].length?'See result':'Next question'}</button>`;}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-q]');if(!t)return;
 if(t.id==='brand'){go('map');return;}
 if(t.dataset.view){go(t.dataset.view);return;}
 if(t.dataset.go){go(t.dataset.go);return;}
 if(t.dataset.q){startQuest(t.dataset.q);return;}
 if(t.dataset.quiz){startQuiz(t.dataset.quiz);return;}
 if(t.dataset.ins!==undefined){insert(t.dataset.ins);return;}
 if(t.dataset.tab){S.bookTab=t.dataset.tab;renderBook();return;}
 if(t.dataset.cat){S.bookCat=t.dataset.cat;renderBook();return;}
 if(t.dataset.try){startSandbox(false);insert(t.dataset.try);return;}
 if(t.dataset.opt!==undefined){answerQuiz(+t.dataset.opt);return;}
 if(t.dataset.qz){if(t.dataset.qz==='again')startQuiz(S.quiz.w);else{S.quiz.i++;S.quiz.answered=false;renderQuiz();}return;}
 if(t.dataset.m){const a=t.dataset.m;closeModal();if(a==='next')startQuest(t.dataset.id);else if(a==='map')go('map');return;}
 if(t.id==='resetProg'){if(t.dataset.arm){P={xp:0,done:{},quiz:{}};saveProg();updateHeader();renderMap();}else{t.dataset.arm='1';t.textContent='Click again to erase everything';}return;}
 if(t.id==='run'){const i=$('#cmd');exec(i.value);i.value='';liveExplain('');i.focus();return;}
 const a=t.dataset.act;if(a){
  if(a==='hint')showHint();else if(a==='restart')startQuest(S.quest.id);else if(a==='map')go('map');
  else if(a==='sample'){startSandbox(true);runSilent(['git clone https://github.com/gitty/garden.git']);printLines([[['(sample project loaded: you cloned https://github.com/gitty/garden.git)','dim']]]);renderAll();}
  else if(a==='blank')startSandbox(true);
  else if(a==='mate'){exec('teammate');}
 }});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
$('#cmd').addEventListener('keydown',e=>{const i=e.target;
 if(e.key==='Enter'){exec(i.value);i.value='';liveExplain('');}
 else if(e.key==='ArrowUp'){e.preventDefault();if(S.hi>0){S.hi--;i.value=S.hist[S.hi]||'';liveExplain(i.value);}}
 else if(e.key==='ArrowDown'){e.preventDefault();if(S.hi<S.hist.length-1){S.hi++;i.value=S.hist[S.hi];}else{S.hi=S.hist.length;i.value='';}liveExplain(i.value);}
 else if(e.key==='Tab'){e.preventDefault();complete();}
 else if(e.key==='l'&&e.ctrlKey){e.preventDefault();$('#tout').innerHTML='';}});
$('#cmd').addEventListener('input',e=>liveExplain(e.target.value));
document.addEventListener('input',e=>{if(e.target.id==='bq'){S.bookQ=e.target.value;const pos=e.target.selectionStart;renderBook();const n=$('#bq');n.focus();n.setSelectionRange(pos,pos);}});

/* ---------- boot ---------- */
$('#logo').innerHTML=gitty('happy');renderChips();updateHeader();renderMap();setView('map');
</script></body></html>
